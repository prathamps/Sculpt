openapi: 3.1.0
info:
  title: Sculpt API
  version: 1.0.0
  description: |
    REST API for Sculpt, a self-hostable visual collaboration platform.

    **Authentication** is by `httpOnly` session cookie (`token`), set by
    `POST /api/auth/login` or an OAuth callback. Send credentials with every
    request (`credentials: "include"` in the browser). The admin panel uses a
    separate `admin_token` cookie obtained from `POST /api/admin/login`; the two
    are not interchangeable.

    **Delegated access (AI agents, scripts).** Every route a person can use is
    also reachable with `Authorization: Bearer <token>`, where the token is
    either an OAuth 2.1 access token whose audience is this API, or a personal
    access token (`sculpt_pat_…`) created under Account → AI & integrations.
    AI assistants normally connect through the Sculpt MCP server instead, which
    exchanges its own tokens for API tokens (RFC 8693). Tokens carry scopes that
    mirror the project role tiers; the API intersects them with the caller's
    role, so a token can never do more than its owner:

    | Scope | Role tier | Covers |
    | --- | --- | --- |
    | `sculpt:read` | VIEWER | projects, media, comments, reviews, members, notifications, search, reports |
    | `sculpt:feedback` | MEMBER | comments, replies, likes, resolving, attachments, review decisions, clearing notifications |
    | `sculpt:content` | EDITOR | creating projects, uploads, versions, renaming, moving and deleting media and folders, due dates |
    | `sculpt:manage` | OWNER | project settings, members, roles, invitations, share links, joining or leaving, deleting projects |
    | `sculpt:account` | — | display name and notification preferences |

    A token missing a scope gets `403` with `{"code": "insufficient_scope",
    "requiredScope": "…"}` and a `WWW-Authenticate` challenge naming the scope.
    Password, two-factor, account deletion, data export, token management,
    consent and the admin console are **session-only**: tokens are refused there
    whatever their scopes.

    **Authorization** is per project. Roles rank
    `VIEWER < MEMBER < EDITOR < OWNER`:

    | Role | Can |
    | --- | --- |
    | VIEWER | read projects, media and comments |
    | MEMBER | + comment, reply, like, record review decisions |
    | EDITOR | + upload media and versions, rename/delete media, set due dates |
    | OWNER | + manage members and roles, share links, invitations, the project |

    Failures return `{"message": "..."}`. Unexpected failures are `500` with a
    generic message — internal error details are never returned.
  license:
    name: MIT
    url: https://github.com/prathamps/Sculpt/blob/main/LICENSE

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://sculpt.example.com
    description: Self-hosted behind the bundled Caddy profile

tags:
  - name: Auth
  - name: Users
  - name: Projects
  - name: Members
  - name: Sharing
  - name: Media
  - name: Comments
  - name: Folders
  - name: Reviews
  - name: Search
  - name: Notifications
  - name: Export
  - name: Admin
  - name: OAuth
  - name: Integrations
  - name: System

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: token
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_token
    metricsToken:
      type: http
      scheme: bearer
    bearerToken:
      type: http
      scheme: bearer
      description: An OAuth access token for this API or a personal access token (sculpt_pat_…).
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            sculpt:read: View projects, media, comments, reviews, members and notifications
            sculpt:feedback: Comment, react, resolve and record review decisions
            sculpt:content: Create projects and manage media, versions and folders
            sculpt:manage: Administer projects, members and sharing
            sculpt:account: Update display name and notification preferences

  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    auditAction:
      name: action
      in: query
      schema: { type: string }
    auditActor:
      name: actorId
      in: query
      schema: { type: string }
    auditTargetType:
      name: targetType
      in: query
      schema: { type: string }
    auditTargetId:
      name: targetId
      in: query
      schema: { type: string }
    auditIp:
      name: ipAddress
      in: query
      schema: { type: string }
    auditFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    auditTo:
      name: to
      in: query
      schema: { type: string, format: date-time }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]

    ProjectRole:
      type: string
      enum: [VIEWER, MEMBER, EDITOR, OWNER]

    MediaType:
      type: string
      enum: [IMAGE, VIDEO, PDF, MODEL]

    ProxyStatus:
      type: string
      enum: [PENDING, READY, FAILED]

    ReviewStatus:
      type: string
      enum: [PENDING, CHANGES_REQUESTED, APPROVED]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        role: { type: string, enum: [USER, ADMIN] }
        avatarUrl: { type: [string, "null"] }
        emailNotifications: { type: boolean }

    ImageVersion:
      type: object
      properties:
        id: { type: string }
        url:
          type: string
          description: Relative path served through the authenticated media route.
        versionName: { type: string }
        versionNumber: { type: integer }
        mediaType: { $ref: "#/components/schemas/MediaType" }
        duration: { type: [number, "null"] }
        frameRate:
          type: [number, "null"]
          description: Probed with ffprobe; drives frame-accurate stepping. Video proxies are encoded at exactly this constant rate.
        startTimecode:
          type: [string, "null"]
          description: SMPTE timecode of the first frame as the camera recorded it (`HH:MM:SS:FF`, with `;` before the frames for drop-frame).
        thumbnailUrl: { type: [string, "null"] }
        proxyUrl:
          type: [string, "null"]
          description: Browser-viewable derivative. Consumers prefer this over `url`. Video proxies are H.264 up to 1080p with a keyframe every second.
        proxyLowUrl:
          type: [string, "null"]
          description: A lighter 540p video rendition for phones and slow connections, present when the source is larger than 540p.
        proxyStatus: { $ref: "#/components/schemas/ProxyStatus" }
        reviewStatus: { $ref: "#/components/schemas/ReviewStatus" }
        dueAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    RevisionCheckItem:
      type: object
      properties:
        commentId: { type: string }
        content: { type: string }
        author: { type: object }
        createdAt: { type: string, format: date-time }
        internal: { type: boolean }
        resolved: { type: boolean }
        fromVersion:
          type: object
          properties:
            id: { type: string }
            versionName: { type: string }
            versionNumber: { type: integer }
        timestamp: { type: [number, "null"] }
        timestampEnd: { type: [number, "null"] }
        page: { type: [integer, "null"] }
        modelAnchor: { type: [object, "null"] }
        annotation: {}
        check:
          type: [object, "null"]
          properties:
            status: { type: string, enum: [FIXED, NOT_FIXED] }
            checkedBy: { type: object }
            checkedAt: { type: string, format: date-time }
        stillOpenOn:
          type: [object, "null"]
          properties:
            versionNumber: { type: integer }
            versionName: { type: string }

    ResumableUpload:
      type: object
      properties:
        id: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        offset:
          type: integer
          description: Bytes received so far; the next chunk starts here.
        chunkSize:
          type: integer
          description: Largest chunk the server accepts.

    Image:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        projectId: { type: string }
        latestVersion: { $ref: "#/components/schemas/ImageVersion" }
        versionCount: { type: integer }
        createdAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/Image" }
        members:
          type: array
          items:
            type: object
            properties:
              role: { $ref: "#/components/schemas/ProjectRole" }
              user: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }

    Annotation:
      type: object
      properties:
        type: { type: string, enum: [pencil, rect, line] }
        color: { type: string }
        points:
          type: array
          maxItems: 5000
          items:
            type: object
            properties:
              x: { type: number, minimum: 0, maximum: 1 }
              y: { type: number, minimum: 0, maximum: 1 }
      required: [type, points]

    ModelAnchor:
      type: object
      properties:
        point:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
        normal:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
        camera:
          type: object
          properties:
            position: { type: array, items: { type: number } }
            target: { type: array, items: { type: number } }
      required: [point]

    Comment:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        imageVersionId: { type: string }
        parentId: { type: [string, "null"] }
        annotation: { $ref: "#/components/schemas/Annotation" }
        timestamp:
          type: [number, "null"]
          description: Video anchor, in seconds.
        timestampEnd: { type: [number, "null"] }
        page: { type: [integer, "null"], description: PDF page anchor. }
        modelAnchor: { $ref: "#/components/schemas/ModelAnchor" }
        resolved: { type: boolean }
        likeCount: { type: integer }
        isLikedByCurrentUser: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
        replies:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        createdAt: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string }
        decision: { type: string, enum: [APPROVED, CHANGES_REQUESTED] }
        note: { type: [string, "null"] }
        user: { $ref: "#/components/schemas/User" }
        updatedAt: { type: string, format: date-time }

    ShareLink:
      type: object
      description: |
        Only a SHA-256 hash of the token is stored, so the joinable URL is
        returned once, by the create call, and can never be listed again.
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
        expiresAt: { type: [string, "null"], format: date-time }
        maxUses: { type: [integer, "null"] }
        useCount: { type: integer }
        createdAt: { type: string, format: date-time }

    IssuedShareLink:
      allOf:
        - $ref: "#/components/schemas/ShareLink"
        - type: object
          properties:
            token:
              type: string
              description: Shown only in this response; not recoverable later.

    Folder:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: [string, "null"] }
        imageCount: { type: integer }

    Page:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }

  responses:
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted at this role.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Absent, or hidden because the caller cannot see it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: The request body or query failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts from this address.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - sessionCookie: []
  - bearerToken: []

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness and dependency status
      security: []
      responses:
        "200":
          description: Database reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  components:
                    type: object
                    properties:
                      database: { type: string, enum: [ok, degraded, down] }
                      redis: { type: string, enum: [ok, degraded, down] }
        "503":
          description: Database unreachable — drain this instance.

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      description: |
        Disabled (404) unless `METRICS_TOKEN` is set. Request latency by route
        template, open realtime connections, rendition and notification queue
        depths, and Node process metrics.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain: {}
        "401": { description: Missing or wrong bearer token. }
        "404": { description: Metrics are not enabled on this instance. }

  /uploads/{filename}:
    get:
      tags: [Media]
      summary: Fetch a stored media file
      description: |
        Resolves the file's owning project and verifies membership. On private
        object storage it redirects to a short-lived presigned URL. Supports
        range requests for video and PDF.
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: File contents. }
        "302": { description: Redirect to a presigned object URL. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
              required: [email, password]
      responses:
        "201": { description: Account created. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { description: Email already registered. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in and receive a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        "200":
          description: |
            Signed in and `token` cookie set, or, when the account uses
            two-factor authentication, `{ "mfaRequired": true }` with a
            five-minute `mfa_challenge` cookie to present to
            `/api/auth/mfa/verify`.
        "401": { description: Invalid credentials. }
        "429": { description: "Rate limited, or the account is locked after repeated failures." }

  /api/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete a sign-in with a two-factor code
      description: |
        Consumes the `mfa_challenge` cookie set by a password, OAuth or admin
        sign-in. Each authenticator code and recovery code is accepted once.
        Failures count toward the account lockout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide exactly one of `code` or `recoveryCode`.
              properties:
                code: { type: string, pattern: "^\\d{6}$" }
                recoveryCode: { type: string }
      responses:
        "200":
          description: Signed in; the user or admin session cookie is set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [user, admin] }
        "401": { description: "Wrong code, or the challenge expired." }
        "429": { description: Account locked after repeated failures. }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out and revoke this session
      responses:
        "200": { description: Session revoked and cookie cleared. }

  /api/auth/providers:
    get:
      tags: [Auth]
      summary: Which OAuth providers this instance has configured
      security: []
      responses:
        "200":
          description: Provider availability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  google: { type: boolean }
                  github: { type: boolean }

  /api/auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Always responds `202`, whether or not the address has an account, so it
        cannot be used to enumerate users. Requires SMTP to be configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        "202": { description: Accepted. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/password-reset/complete:
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      description: Single-use, expires after one hour, and signs out every session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
              required: [token, password]
      responses:
        "200": { description: Password updated. }
        "400": { description: "Token invalid, used or expired." }

  /api/users/me:
    get:
      tags: [Users]
      summary: The signed-in user
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Update your profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatarUrl: { type: [string, "null"] }
      responses:
        "200": { description: Updated profile. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Users]
      summary: Delete your account
      description: |
        Removes your profile, comments and reviews. Projects you solely own are
        deleted with their media, which must be acknowledged explicitly.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Required unless the account is OAuth-only.
                deleteOwnedProjects: { type: boolean, default: false }
      responses:
        "204": { description: Account deleted. }
        "400": { description: "Confirmation missing, or you solely own projects." }
        "403": { description: Password incorrect. }

  /api/users/me/password:
    post:
      tags: [Users]
      summary: Change your password
      description: Signs out every other session and re-issues this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
              required: [currentPassword, newPassword]
      responses:
        "200": { description: Password updated. }
        "403": { description: Current password incorrect. }

  /api/users/me/notification-preferences:
    patch:
      tags: [Users]
      summary: Toggle offline-activity emails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailNotifications: { type: boolean }
              required: [emailNotifications]
      responses:
        "200": { description: Preference saved. }

  /api/users/me/mfa:
    get:
      tags: [Users]
      summary: Your two-factor authentication status
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  enabledAt: { type: [string, "null"], format: date-time }
                  recoveryCodesRemaining: { type: integer }
                  required: { type: boolean }

  /api/users/me/mfa/setup:
    post:
      tags: [Users]
      summary: Start two-factor enrollment
      description: Returns a new TOTP secret and otpauth URI. Nothing changes until it is confirmed.
      responses:
        "200":
          description: Pending secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauthUri: { type: string }

  /api/users/me/mfa/enable:
    post:
      tags: [Users]
      summary: Confirm enrollment with a code from the authenticator app
      description: Signs out every other session and returns ten single-use recovery codes, shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: "^\\d{6}$" }
              required: [code]
      responses:
        "200":
          description: Two-factor is on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes: { type: array, items: { type: string } }
        "400": { description: The code did not match. }

  /api/users/me/mfa/recovery-codes:
    post:
      tags: [Users]
      summary: Replace your recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide exactly one of `code` or `recoveryCode`.
              properties:
                code: { type: string, pattern: "^\\d{6}$" }
                recoveryCode: { type: string }
      responses:
        "200": { description: New recovery codes; the old ones stop working. }
        "403": { description: The code is not valid. }

  /api/users/me/mfa/disable:
    post:
      tags: [Users]
      summary: Turn off two-factor authentication
      description: Refused when MFA_REQUIRED is set, or for administrators while ADMIN_MFA_REQUIRED is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: Required for password accounts. }
                code: { type: string }
                recoveryCode: { type: string }
      responses:
        "200": { description: Two-factor is off; other sessions are signed out. }
        "403": { description: "Wrong password or code, or policy requires two-factor." }

  /api/users/me/export:
    get:
      tags: [Users]
      summary: Download everything held about your account
      responses:
        "200":
          description: JSON attachment.
          content:
            application/json:
              schema: { type: object }

  /api/projects:
    get:
      tags: [Projects]
      summary: Projects you are a member of
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated projects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalPages: { type: integer }
    post:
      tags: [Projects]
      summary: Create a project (you become its OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
              required: [name]
      responses:
        "201": { description: Project created. }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Projects]
      summary: One project with its media and members
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Projects]
      summary: Rename a project or change its content controls (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send at least one field.
              properties:
                name: { type: string }
                allowDownloads:
                  type: boolean
                  description: When false, only EDITOR and OWNER may download originals.
                watermarkViewers:
                  type: boolean
                  description: Overlay each viewer's email and the date on viewed media.
      responses:
        "200": { description: Updated. }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Projects]
      summary: Delete a project and all its media (OWNER)
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{id}/my-role:
    get:
      tags: [Projects]
      summary: Your role in this project
      description: Used for UI gating only; the server re-checks on every call.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { $ref: "#/components/schemas/ProjectRole" }
                  allowDownloads: { type: boolean }
                  watermarkViewers: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{id}/invite:
    post:
      tags: [Members]
      summary: Invite someone by email (OWNER)
      description: |
        Existing accounts are added immediately. Unknown addresses receive a
        tokenised invitation valid for seven days.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                role:
                  $ref: "#/components/schemas/ProjectRole"
              required: [email]
      responses:
        "200":
          description: Invitation sent or member added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitedExistingUser: { type: boolean }
                  email: { type: string }
        "400": { description: "Already a member, or OWNER was requested." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/invitations:
    get:
      tags: [Members]
      summary: Pending invitations (OWNER)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Pending invitations. }

  /api/projects/{projectId}/invitations/{invitationId}:
    delete:
      tags: [Members]
      summary: Revoke a pending invitation (OWNER)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked. }

  /api/invitations/{token}/accept:
    post:
      tags: [Members]
      summary: Accept an invitation
      description: The signed-in account's email must match the invited address.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Joined; returns the project. }
        "400": { description: Expired. }
        "403": { description: Sent to a different address. }
        "404": { description: Invalid or already accepted. }

  /api/projects/{projectId}/members/{userId}/role:
    patch:
      tags: [Members]
      summary: Change a member's role (OWNER)
      description: Refuses to demote the project's last remaining owner.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
              required: [role]
      responses:
        "200": { description: Role updated. }
        "400": { description: Would leave the project without an owner. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/members/{userId}:
    delete:
      tags: [Members]
      summary: Remove a member (OWNER)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Removed. }
        "400": { description: Owners cannot be removed. }

  /api/projects/{projectId}/share-links:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Sharing]
      summary: Active share links (OWNER)
      responses:
        "200":
          description: Share links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareLink" }
    post:
      tags: [Sharing]
      summary: Create a share link (OWNER)
      description: |
        Following a link never lowers an existing member's role. `OWNER` cannot
        be granted this way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
                expiresInDays: { type: [integer, "null"], minimum: 1, maximum: 365 }
                maxUses: { type: [integer, "null"], minimum: 1, maximum: 1000 }
              required: [role]
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }

  /api/projects/{projectId}/share-links/{linkId}:
    delete:
      tags: [Sharing]
      summary: Revoke a share link (OWNER)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: linkId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked. }

  /api/share/{token}:
    post:
      tags: [Sharing]
      summary: Join a project via a share link
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Joined; returns the project. }
        "404": { description: "Invalid, revoked, expired or used up." }

  /api/projects/{projectId}/images:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Media]
      summary: Media in a project
      description: |
        Without `page` the whole project (or folder) is returned as an array.
        Pass `page` to receive one sorted, filtered page plus per-type counts
        for the folder; the web app always pages.
      parameters:
        - name: folderId
          in: query
          description: A folder id, or `root` for files outside any folder. Omit for every file.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 60 }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, a-z, z-a], default: newest }
        - name: q
          in: query
          description: Case-insensitive name filter.
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          schema: { type: string, enum: [IMAGE, VIDEO, PDF, MODEL] }
      responses:
        "200":
          description: Media with latest versions — an array, or a page when `page` is set.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/Image" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Image" }
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
                      totalPages: { type: integer }
                      counts:
                        type: object
                        properties:
                          total: { type: integer }
                          images: { type: integer }
                          videos: { type: integer }
                          pdfs: { type: integer }
                          models: { type: integer }
    post:
      tags: [Media]
      summary: Upload media (EDITOR)
      description: |
        Up to ten files per request. `filesMeta` is a JSON array parallel to
        `images`, declaring per-file `duration`, `hasThumbnail` and
        `hasModelProxy`. 3D models are converted to GLB in the browser and
        uploaded as `modelProxies`. Videos and pro image formats are normalised
        server-side afterwards, so a version may return `proxyStatus: PENDING`.
        Large files can be sent first through `/api/uploads` and named here in
        `uploadIds`; they are appended after any multipart `images`, and
        `filesMeta` covers both in that order.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items: { type: string, format: binary }
                thumbnails:
                  type: array
                  items: { type: string, format: binary }
                modelProxies:
                  type: array
                  items: { type: string, format: binary }
                filesMeta: { type: string }
                uploadIds:
                  type: string
                  description: JSON array of finished resumable upload ids from `/api/uploads`.
      responses:
        "201":
          description: The media items this request created.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Image" }
        "400": { description: "Unsupported type, oversized, or bad metadata." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/images/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Media]
      summary: One media item with all versions
      responses:
        "200":
          description: Media.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
    put:
      tags: [Media]
      summary: Rename media (EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses:
        "200": { description: Renamed. }
    delete:
      tags: [Media]
      summary: Delete media and every version (EDITOR)
      responses:
        "204": { description: Deleted. }

  /api/images/{imageId}/versions:
    post:
      tags: [Media]
      summary: Upload a new version (EDITOR)
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
                thumbnail: { type: string, format: binary }
                modelProxy: { type: string, format: binary }
                versionName: { type: string }
                duration: { type: string }
                uploadIds:
                  type: string
                  description: A JSON array holding one finished resumable upload id, sent instead of `image`.
      responses:
        "201": { description: Version created. }
        "400": { description: "No file, or unsupported type." }

  /api/images/versions/{versionId}:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Media]
      summary: One version
      responses:
        "200":
          description: Version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageVersion" }
    put:
      tags: [Media]
      summary: Rename a version (EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                versionName: { type: string }
              required: [versionName]
      responses:
        "200": { description: Renamed. }
    delete:
      tags: [Media]
      summary: Delete a version (EDITOR)
      responses:
        "204": { description: Deleted. }
        "400": { description: Cannot delete the only version. }

  /api/images/versions/{imageVersionId}/comments:
    parameters:
      - name: imageVersionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Comments]
      summary: Comment threads on a version
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: A page of top-level comments, each with its replies.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Comment" }
    post:
      tags: [Comments]
      summary: Post a comment (MEMBER)
      description: |
        Anchors that do not apply to the version's media type are discarded
        rather than trusted, and video timestamps are clamped to the real
        duration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 5000 }
                parentId: { type: [string, "null"] }
                annotation: { $ref: "#/components/schemas/Annotation" }
                timestamp: { type: [number, "null"] }
                timestampEnd: { type: [number, "null"] }
                page: { type: [integer, "null"] }
                modelAnchor: { $ref: "#/components/schemas/ModelAnchor" }
              required: [content]
      responses:
        "201": { description: Comment created. }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/images/comments/{commentId}/revisions:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Comments]
      summary: Earlier wording of an edited comment (VIEWER)
      responses:
        "200":
          description: Revisions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    content: { type: string }
                    editedById: { type: [string, "null"] }
                    createdAt: { type: string, format: date-time }

  /api/images/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Comments]
      summary: Edit your own comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
              required: [content]
      responses:
        "200": { description: Updated. }
        "403": { description: Not the author. }
    delete:
      tags: [Comments]
      summary: Delete your own comment
      responses:
        "204": { description: Deleted. }
        "403": { description: Not the author. }

  /api/images/comments/{commentId}/like:
    post:
      tags: [Comments]
      summary: Toggle your like
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New like state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked: { type: boolean }
                  count: { type: integer }

  /api/images/comments/{commentId}/resolve:
    post:
      tags: [Comments]
      summary: Toggle resolved (author only)
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New resolution state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved: { type: boolean }

  /api/images/versions/{versionId}/reviews:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Reviews]
      summary: Review status and decisions for a version
      responses:
        "200":
          description: Derived status plus every decision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviewStatus: { $ref: "#/components/schemas/ReviewStatus" }
                  dueAt: { type: [string, "null"], format: date-time }
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
    post:
      tags: [Reviews]
      summary: Approve or request changes (MEMBER)
      description: |
        One decision per reviewer; posting again replaces yours. A single
        `CHANGES_REQUESTED` outweighs any number of approvals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [APPROVED, CHANGES_REQUESTED] }
                note: { type: [string, "null"], maxLength: 2000 }
              required: [decision]
      responses:
        "200":
          description: Resulting version status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviewStatus: { $ref: "#/components/schemas/ReviewStatus" }
    delete:
      tags: [Reviews]
      summary: Withdraw your own decision (MEMBER)
      responses:
        "200": { description: Recalculated version status. }

  /api/images/versions/{versionId}/due-date:
    patch:
      tags: [Reviews]
      summary: Set or clear a review due date (EDITOR)
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dueAt: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: Due date saved. }

  /api/projects/{projectId}/reviews/summary:
    get:
      tags: [Reviews]
      summary: Counts of versions by review status
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Counts per status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  PENDING: { type: integer }
                  CHANGES_REQUESTED: { type: integer }
                  APPROVED: { type: integer }

  /api/search:
    get:
      tags: [Search]
      summary: Search projects, media and comments
      description: Results are restricted to projects the caller belongs to.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Grouped matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { type: object } }
                  media: { type: array, items: { type: object } }
                  comments: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/notifications:
    get:
      tags: [Notifications]
      summary: Your notifications
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Page of notifications plus an unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: { type: array, items: { type: object } }
                  total: { type: integer }
                  unread: { type: integer }

  /api/notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      summary: Mark one notification read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Marked read. }

  /api/notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all your notifications read
      responses:
        "200":
          description: How many changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /api/export/image/{imageId}/report.json:
    get:
      tags: [Export]
      summary: Export a review report as JSON
      description: |
        Internal comments are included only for EDITOR and OWNER.
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Report attachment. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/export/image/{imageId}/report.csv:
    get:
      tags: [Export]
      summary: Export a review report as CSV
      description: |
        CSV cells beginning with a formula character are neutralised. Internal
        comments are included only for EDITOR and OWNER.
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Report attachment. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/export/version/{versionId}/markers.edl:
    get:
      tags: [Export]
      summary: Export a video version's comments as timeline markers (EDL)
      description: |
        A CMX-style EDL in the form DaVinci Resolve imports with Timeline >
        Import > Timeline Markers from EDL. One marker per timestamped
        top-level comment, blue when open and green when resolved, with range
        comments carrying their duration. Markers are placed from
        `timelineStart`, else the camera's start timecode, else 01:00:00:00.
        Internal comments are included only for EDITOR and OWNER.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
        - name: timelineStart
          in: query
          description: Timecode of the first frame on the editor's timeline, as `HH:MM:SS:FF`.
          schema: { type: string }
      responses:
        "200": { description: EDL attachment. }
        "400": { description: "Not a video version, or a malformed timelineStart." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/export/version/{versionId}/markers.xml:
    get:
      tags: [Export]
      summary: Export a video version's comments as sequence markers (FCP7 XML)
      description: |
        Final Cut Pro 7 XML (`xmeml` version 5) holding one sequence with a
        marker per timestamped comment, for Premiere Pro, DaVinci Resolve and
        Final Cut Pro 7. Same placement and visibility rules as the EDL.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
        - name: timelineStart
          in: query
          schema: { type: string }
      responses:
        "200": { description: XML attachment. }
        "400": { description: "Not a video version, or a malformed timelineStart." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/images/versions/{versionId}/revision-check:
    get:
      tags: [Reviews]
      summary: Revision check for a version
      description: |
        Every open top-level comment from earlier versions of the same file,
        plus anything already checked on this version, oldest version first.
        Each item carries the original anchor (timestamp, page or 3D pin and
        drawing) so a reviewer can jump to the same spot on the new version,
        this version's verdict if any, and the last earlier version where it
        was flagged as still not fixed. Internal comments appear only for
        EDITOR and OWNER.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Checklist and counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versionId: { type: string }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RevisionCheckItem" }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      fixed: { type: integer }
                      notFixed: { type: integer }
                      unchecked: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/images/versions/{versionId}/revision-check/{commentId}:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: { type: string }
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Reviews]
      summary: Record whether earlier feedback is fixed in this version (MEMBER)
      description: |
        `FIXED` resolves the original comment and may only be recorded by the
        person who gave the feedback or an EDITOR. `NOT_FIXED` can come from
        any MEMBER; it carries the feedback forward to the next version and
        reopens it if this version's earlier check had resolved it. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [FIXED, NOT_FIXED] }
      responses:
        "200":
          description: Verdict stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [FIXED, NOT_FIXED] }
                  resolved: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The comment is not open feedback from an earlier version of this file. }
    delete:
      tags: [Reviews]
      summary: Undo a revision check
      description: Allowed for whoever recorded it or an EDITOR. Undoing a fix confirmation reopens the comment it resolved.
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/uploads:
    post:
      tags: [Media]
      summary: Start a resumable upload (EDITOR)
      description: |
        Opens an upload session for one large file so it can be sent in
        chunks and survive dropped connections. Give the target `projectId`,
        or `imageId` when the file will become a new version. Send the bytes
        with `PATCH /api/uploads/{uploadId}`, then name the finished upload in
        `uploadIds` on the ordinary upload route. The ordinary route's type
        and size limits apply, the content is checked against the declared
        type when the last chunk arrives, and sessions idle for a day are
        discarded. Each person may hold 20 unfinished uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, size]
              properties:
                projectId: { type: string }
                imageId: { type: string }
                fileName: { type: string, maxLength: 1024 }
                mimeType: { type: string }
                size: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Session opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumableUpload" }
        "400": { description: "Unsupported type, too large, or not exactly one of projectId and imageId." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { description: Too many unfinished uploads. }

  /api/uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string, pattern: "^[a-f0-9]{32}$" }
    get:
      tags: [Media]
      summary: How much of a resumable upload has arrived
      description: Read `offset` to resume after a dropped connection or a reload.
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumableUpload" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Media]
      summary: Append a chunk to a resumable upload
      description: |
        The body is the raw bytes, at most `chunkSize` long, starting at
        `offset`. A request whose offset is not where the upload stands is
        refused with 409 and the offset to resume from.
      parameters:
        - name: offset
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Chunk stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumableUpload" }
        "400": { description: "Chunk too large, past the declared size, or content that does not match its type." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Wrong offset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  offset: { type: integer }
    delete:
      tags: [Media]
      summary: Cancel a resumable upload
      responses:
        "204": { description: Discarded. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/auth/google:
    get:
      tags: [Auth]
      summary: Start Google sign-in
      description: |
        Redirects to Google. A single-use `state` value is issued in a
        short-lived `oauth_state` cookie and must come back on the callback,
        so a sign-in cannot be started in one browser and finished in another.
        Returns 503 when Google OAuth is not configured on this server.
      responses:
        "302": { description: Redirect to Google. }
        "503": { description: Google sign-in is not configured. }

  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Complete Google sign-in
      description: |
        Verifies the `state` against the issuing browser's cookie, then sets
        the session cookie and redirects to the web app. An account whose email
        is already registered is linked only when Google reports it verified.
      responses:
        "302": { description: "Redirect to the web app, with a session cookie." }
        "503": { description: Google sign-in is not configured. }

  /api/auth/github:
    get:
      tags: [Auth]
      summary: Start GitHub sign-in
      description: |
        Redirects to GitHub, with the same single-use `state` protection as
        Google. Returns 503 when GitHub OAuth is not configured.
      responses:
        "302": { description: Redirect to GitHub. }
        "503": { description: GitHub sign-in is not configured. }

  /api/auth/github/callback:
    get:
      tags: [Auth]
      summary: Complete GitHub sign-in
      description: |
        Verifies the `state`, then sets the session cookie. Linking to an
        existing account requires a verified GitHub email address.
      responses:
        "302": { description: "Redirect to the web app, with a session cookie." }
        "503": { description: GitHub sign-in is not configured. }

  /api/users/profile:
    get:
      tags: [Users]
      summary: The signed-in account
      description: |
        Returns 401 when no session is present; the web app uses this to decide
        whether anyone is signed in.
      responses:
        "200": { description: The current account. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/projects/{projectId}/members:
    get:
      tags: [Members]
      summary: Members of a project
      description: Any member of the project can read the roster.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Members with their roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    role: { $ref: "#/components/schemas/ProjectRole" }
                    createdAt: { type: string, format: date-time }
                    userId: { type: string }
                    user: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/members/leave:
    post:
      tags: [Members]
      summary: Leave a project
      description: |
        Removes your own membership. The only remaining OWNER cannot leave -
        promote someone else or delete the project instead.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: You are no longer a member. }
        "400": { description: You are the last owner. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/folders:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Folders]
      summary: Folder tree for a project (VIEWER)
      responses:
        "200":
          description: Every folder, with the number of files in each.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Folder" }
    post:
      tags: [Folders]
      summary: Create a folder (EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                parentId: { type: [string, "null"] }
      responses:
        "201": { description: Folder created. }
        "400": { description: A folder of that name already exists here. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/folders/{folderId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: folderId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Folders]
      summary: Rename a folder (EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        "200": { description: Folder renamed. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Folders]
      summary: Delete a folder (EDITOR)
      description: |
        Child folders are removed with it; files inside move back to the
        project root rather than being deleted.
      responses:
        "204": { description: Folder deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/folders/{folderId}/path:
    get:
      tags: [Folders]
      summary: Breadcrumb trail for a folder (VIEWER)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: folderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ancestors, outermost first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/folders/{folderId}/parent:
    patch:
      tags: [Folders]
      summary: Move a folder (EDITOR)
      description: A folder can never be moved inside itself or a descendant.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: folderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId: { type: [string, "null"] }
      responses:
        "200": { description: Folder moved. }
        "400": { description: The move would create a cycle. }

  /api/projects/{projectId}/images/folder:
    patch:
      tags: [Folders]
      summary: Move several files into a folder (EDITOR)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageIds]
              properties:
                imageIds:
                  type: array
                  items: { type: string }
                folderId: { type: [string, "null"] }
      responses:
        "200": { description: Files moved. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/images/{imageId}/folder:
    patch:
      tags: [Folders]
      summary: Move one file into a folder (EDITOR)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folderId: { type: [string, "null"] }
      responses:
        "200": { description: File moved. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/images/delete:
    post:
      tags: [Media]
      summary: Delete several files (EDITOR)
      description: |
        Every id must belong to this project; otherwise nothing is deleted.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageIds]
              properties:
                imageIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        "200":
          description: How many files were deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/images/versions/{versionId}/download:
    get:
      tags: [Media]
      summary: Download the original file (VIEWER)
      description: |
        On object storage this redirects to a presigned URL valid for five
        minutes. The download is recorded in the audit log.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: The original file. }
        "302": { description: Redirect to a presigned object-storage URL. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/images/comments/{commentId}/attachments:
    post:
      tags: [Comments]
      summary: Attach reference files to your comment
      description: |
        Only the comment's author may attach, at most three files per comment,
        25 MB each, images or PDF only. File contents are checked against the
        declared type.
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201": { description: The comment's attachments. }
        "400": { description: "Too many files, or content does not match its type." }
        "403": { description: You are not the author. }

  /api/admin/logout:
    post:
      tags: [Admin]
      summary: End the admin session
      responses:
        "200": { description: Admin session revoked. }

  /api/admin/profile:
    get:
      tags: [Admin]
      summary: The signed-in administrator
      responses:
        "200": { description: Administrator profile. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/projects:
    get:
      tags: [Admin]
      summary: Every project, paginated
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200": { description: A page of projects with member and file counts. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/projects/{projectId}:
    get:
      tags: [Admin]
      summary: One project, with its media and members
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Project detail. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/login:
    post:
      tags: [Admin]
      summary: Sign in to the admin panel
      description: |
        Requires an account whose global role is `ADMIN`. Issues a separate
        `admin_token` cookie that an ordinary session token cannot substitute
        for.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        "200": { description: Signed in. }
        "401": { description: Invalid credentials. }
        "403": { description: Not an administrator. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200": { description: Paginated users. }

  /api/admin/users/{userId}/role:
    patch:
      tags: [Admin]
      summary: Change a user's global role
      description: |
        Refuses to demote the last administrator. Changing a role invalidates
        that user's sessions.
      security:
        - adminCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [USER, ADMIN] }
              required: [role]
      responses:
        "200": { description: Role updated. }
        "400": { description: Would remove the last administrator. }

  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Instance totals and 30-day signup trends
      security:
        - adminCookie: []
      responses:
        "200": { description: Dashboard statistics. }

  /api/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Query the audit trail
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/auditAction"
        - $ref: "#/components/parameters/auditActor"
        - $ref: "#/components/parameters/auditTargetType"
        - $ref: "#/components/parameters/auditTargetId"
        - $ref: "#/components/parameters/auditIp"
        - $ref: "#/components/parameters/auditFrom"
        - $ref: "#/components/parameters/auditTo"
      responses:
        "200":
          description: |
            Paginated entries, newest first. Each carries sequence,
            prevHash and hash (the tamper-evidence chain), plus requestId
            and userAgent. actor is null once the account was deleted;
            actorId still identifies it.

  /api/admin/audit-logs/export.csv:
    get:
      tags: [Admin]
      summary: Export the filtered audit trail as CSV
      description: Every export is itself recorded as admin.audit_exported.
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/auditAction"
        - $ref: "#/components/parameters/auditActor"
        - $ref: "#/components/parameters/auditTargetType"
        - $ref: "#/components/parameters/auditTargetId"
        - $ref: "#/components/parameters/auditIp"
        - $ref: "#/components/parameters/auditFrom"
        - $ref: "#/components/parameters/auditTo"
      responses:
        "200":
          description: CSV, oldest first, including the hash chain.
          content:
            text/csv: {}

  /api/admin/audit-logs/verify:
    get:
      tags: [Admin]
      summary: Recompute the audit hash chain and report tampering
      security:
        - adminCookie: []
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  intact: { type: boolean }
                  checked: { type: integer }
                  unchainedLegacyEntries: { type: integer }
                  firstSequence: { type: [integer, "null"] }
                  lastSequence: { type: [integer, "null"] }
                  brokenAtSequence: { type: [integer, "null"] }
                  problem:
                    type: [string, "null"]
                    enum: [content_changed, link_broken, entries_missing, null]

  /.well-known/oauth-authorization-server:
    get:
      tags: [OAuth]
      summary: Authorization server metadata (RFC 8414)
      security: []
      responses:
        "200":
          description: Endpoints, supported grants, scopes and PKCE methods. CORS-open.
          content:
            application/json:
              schema: { type: object }

  /.well-known/oauth-protected-resource:
    get:
      tags: [OAuth]
      summary: Protected resource metadata for this API (RFC 9728)
      security: []
      responses:
        "200":
          description: The API's resource identifier, its authorization server and supported scopes.
          content:
            application/json:
              schema: { type: object }

  /oauth/jwks.json:
    get:
      tags: [OAuth]
      summary: Public keys that verify Sculpt access tokens
      description: ES256 keys. Retired keys stay published until every token they signed has expired.
      security: []
      responses:
        "200":
          description: JSON Web Key Set.
          content:
            application/json:
              schema: { type: object }

  /oauth/authorize:
    get:
      tags: [OAuth]
      summary: Start an authorization code flow
      description: |
        Validates the client, redirect URI, PKCE challenge (S256 required), scopes
        and resource indicator, then redirects the browser to Sculpt's consent page.
        Errors about the client or redirect URI stop at Sculpt; every other error is
        returned to the redirect URI with `error`, `state` and `iss`.
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the consent page, or back to the client with an error. }

  /oauth/register:
    post:
      tags: [OAuth]
      summary: Dynamic client registration (RFC 7591)
      description: Public clients by default. Turned off with OAUTH_DYNAMIC_REGISTRATION=false.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uris: { type: array, items: { type: string } }
                client_name: { type: string }
                client_uri: { type: string }
                logo_uri: { type: string }
                grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
                token_endpoint_auth_method: { type: string, enum: [none, client_secret_basic, client_secret_post] }
                scope: { type: string }
              required: [redirect_uris]
      responses:
        "201":
          description: The registered client, including client_secret for confidential clients.
          content:
            application/json:
              schema: { type: object }
        "400": { description: "invalid_redirect_uri or invalid_client_metadata." }
        "403": { description: Registration is turned off. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /oauth/token:
    post:
      tags: [OAuth]
      summary: Issue tokens
      description: |
        `authorization_code` (PKCE verifier required), `refresh_token` (rotated on every
        use; presenting a spent one revokes the whole grant) and
        `urn:ietf:params:oauth:grant-type:token-exchange` (RFC 8693, reserved for the
        Sculpt MCP service, which trades a token minted for it for a five-minute API token).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type: { type: string }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                scope: { type: string }
                resource: { type: string }
                subject_token: { type: string }
                subject_token_type: { type: string }
              required: [grant_type]
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  scope: { type: string }
                  refresh_token: { type: string }
                  issued_token_type: { type: string }
        "400": { description: "OAuth error (invalid_grant, invalid_scope, invalid_target, …)." }
        "401": { description: invalid_client. }

  /oauth/revoke:
    post:
      tags: [OAuth]
      summary: Revoke a token (RFC 7009)
      description: Revoking any token of a grant revokes the whole grant. Always 200 for unknown tokens.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
                token_type_hint: { type: string }
                client_id: { type: string }
              required: [token]
      responses:
        "200": { description: Revoked, or nothing to revoke. }

  /oauth/introspect:
    post:
      tags: [OAuth]
      summary: Introspect a token (RFC 7662)
      description: Only the first-party MCP service may introspect.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: Token state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  scope: { type: string }
                  sub: { type: string }
                  client_id: { type: string }
                  exp: { type: integer }

  /api/oauth/integration:
    get:
      tags: [Integrations]
      summary: How AI assistants connect to this Sculpt
      security: []
      responses:
        "200":
          description: MCP server URL (null when not configured), authorization server and scope descriptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcpServerUrl: { type: [string, "null"] }
                  authorizationServer: { type: string }
                  scopes:
                    type: array
                    items:
                      type: object
                      properties:
                        scope: { type: string }
                        title: { type: string }
                        description: { type: string }

  /api/oauth/consent/details:
    post:
      tags: [Integrations]
      summary: Describe a pending authorization for the consent page
      description: Session-only.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request: { type: string, description: The signed handle from /oauth/authorize. }
              required: [request]
      responses:
        "200":
          description: >-
            The client and who it really belongs to (identity: verified, identityHost, redirectHost,
            runsLocally, nameMatchesHost, registeredAt), the resource, requested scopes,
            recommendedScopes (ticked by default), previouslyGranted, and rememberedScopes with
            autoApprove when the person already decided this request for this app.
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid, expired or already decided request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/oauth/consent:
    post:
      tags: [Integrations]
      summary: Approve or deny a pending authorization
      description: >-
        Session-only. Approving may narrow the requested scopes, never widen them. Each request
        can be decided once; a second decision is refused with 400.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request: { type: string }
                approved: { type: boolean }
                scopes: { type: array, items: { type: string } }
              required: [request, approved]
      responses:
        "200":
          description: Where to send the browser next (the client's redirect URI with a code or an error).
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectTo: { type: string }

  /api/users/me/connections:
    get:
      tags: [Integrations]
      summary: Apps you have connected to your account
      description: Session-only.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active grants with client identity, scopes and last use.
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /api/users/me/connections/{grantId}:
    delete:
      tags: [Integrations]
      summary: Disconnect an app
      description: Session-only. Takes effect immediately for every token of the grant.
      security:
        - sessionCookie: []
      parameters:
        - { name: grantId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Disconnected. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/me/tokens:
    get:
      tags: [Integrations]
      summary: Your personal access tokens
      description: Session-only. Secrets are never returned after creation.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema: { type: array, items: { type: object } }
    post:
      tags: [Integrations]
      summary: Create a personal access token
      description: >-
        Session-only. Confirm identity with `password`; accounts without a password send a
        two-factor `code` or `recoveryCode` instead, and accounts with neither must have signed in
        within the last 15 minutes (otherwise 403 with code `reauthentication_required`). Tokens
        always expire. The token is shown once, in this response, and the person is emailed.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
                expiresInDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
                password: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
                recoveryCode: { type: string }
              required: [name, scopes]
      responses:
        "201":
          description: The new token, including its secret.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: Wrong password or code, or a recent sign-in is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/me/tokens/{tokenId}:
    delete:
      tags: [Integrations]
      summary: Revoke a personal access token
      description: Session-only.
      security:
        - sessionCookie: []
      parameters:
        - { name: tokenId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/oauth-clients:
    get:
      tags: [Admin]
      summary: Registered OAuth clients
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated clients with active grant counts.
          content:
            application/json:
              schema: { type: object }

  /api/admin/oauth-clients/{clientId}:
    patch:
      tags: [Admin]
      summary: Verify, disable or re-enable an OAuth client
      description: >-
        Verified clients are shown as verified on the consent screen. Disabling revokes every
        grant the client holds. Send at least one of the fields.
      security:
        - adminCookie: []
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled: { type: boolean }
                verified: { type: boolean }
      responses:
        "200": { description: Updated. }
        "404": { $ref: "#/components/responses/NotFound" }
