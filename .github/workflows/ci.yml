name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI gates only — releasing stays with Railway (API) and Vercel (web) git
# integrations. This pipeline blocks merges on lint / typecheck / build / schema
# validation so broken code never reaches the deploy branches.
jobs:
  api:
    name: API · typecheck + build + prisma validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Dummy values so prisma generate/validate run without a real database.
      DATABASE_URL: postgresql://user:pass@localhost:5432/sculpt?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/sculpt?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Type-check & build
        run: npm run build

  web:
    name: Web · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
